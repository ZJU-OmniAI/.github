<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" aria-hidden="true"><style>.pulse{transform-box:fill-box;transform-origin:center;opacity:0;animation:pulse 8s ease-out infinite}@keyframes pulse{0%{opacity:.95;transform:scale(1)}22%{opacity:0;transform:scale(1.85)}100%{opacity:0;transform:scale(1.85)}}.orbit{transform-box:view-box;animation:orbit 8s linear infinite}@keyframes orbit{from{transform:rotate(-135deg)}to{transform:rotate(225deg)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.breathe{animation:breathe 5s ease-in-out infinite alternate}@keyframes breathe{from{opacity:.5}to{opacity:1}}.flow{animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}.shine{animation:shine 7s ease-in-out 1s infinite}@keyframes shine{0%{transform:translateX(0)}30%,100%{transform:translateX(980px)}}.travel{animation:travel 3.2s ease-in-out infinite}@keyframes travel{0%{transform:translateX(0);opacity:0}12%,88%{opacity:1}100%{transform:translateX(236px);opacity:0}}.dot{transform-box:fill-box;transform-origin:center;animation:dot 4s ease-in-out infinite}@keyframes dot{0%,40%,100%{transform:scale(1);opacity:.7}14%{transform:scale(1.75);opacity:1}}.blink{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.pulse{opacity:0}}.beamL{animation:beamL 4s ease-in-out infinite}.beamR{animation:beamR 4s ease-in-out infinite}@keyframes beamL{0%{transform:translateX(0);opacity:0}15%,80%{opacity:1}100%{transform:translateX(420px);opacity:0}}@keyframes beamR{0%{transform:translateX(0);opacity:0}15%,80%{opacity:1}100%{transform:translateX(-420px);opacity:0}}</style><defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#D9E5F5" stop-opacity="0"/><stop offset="1" stop-color="#D9E5F5"/></linearGradient><linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#D9E5F5"/><stop offset="1" stop-color="#D9E5F5" stop-opacity="0"/></linearGradient><linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#5CC0FA" stop-opacity="0"/><stop offset=".5" stop-color="#5CC0FA"/><stop offset="1" stop-color="#5CC0FA" stop-opacity="0"/></linearGradient></defs><rect x="60" y="13" width="486" height="2" fill="url(#l)"/><rect x="654" y="13" width="486" height="2" fill="url(#r)"/><rect class="beamL" x="60" y="12.5" width="90" height="3" rx="1.5" fill="url(#beam)"/><rect class="beamR" x="1050" y="12.5" width="90" height="3" rx="1.5" fill="url(#beam)"/><circle class="dot" style="animation-delay:0s" cx="573" cy="14" r="4.4" fill="#0B8A9A"/><circle class="dot" style="animation-delay:1s" cx="591" cy="14" r="4.4" fill="#1E5FD0"/><circle class="dot" style="animation-delay:2s" cx="609" cy="14" r="4.4" fill="#1C8754"/><circle class="dot" style="animation-delay:3s" cx="627" cy="14" r="4.4" fill="#5B4CC4"/></svg>
